name: CI / Full Validation

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.mov"
      - "**/*.mp4"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.woff2"
      - ".github/ISSUE_TEMPLATE/**"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.mov"
      - "**/*.mp4"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.woff2"
      - ".github/ISSUE_TEMPLATE/**"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, Type, Unit, and Component
    # Pin 26.04: GitHub's Ubuntu 24.04 Azure 6.17 runner has a broken
    # kernel-tools layout that leaves bpftool unusable.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run static and type checks
        run: bash tests/run.sh check

      - name: Run unit, component, and installer smoke tests
        run: |
          bash tests/run.sh unit
          bash tests/run.sh component
          bash tests/run.sh smoke

  distro-install:
    name: Distro install + compile (${{ matrix.name }})
    needs: quality
    # Pin 26.04: GitHub's Ubuntu 24.04 Azure 6.17 runner has a broken
    # kernel-tools layout that leaves bpftool unusable. Containers share the
    # runner kernel, so the Ubuntu matrix image must use the same release.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: debian:12-slim
            preinstall: apt-get update && apt-get install -y bash ca-certificates curl git python3 procps iproute2
          - name: ubuntu
            image: ubuntu:26.04
            preinstall: apt-get update && apt-get install -y bash ca-certificates curl git python3 procps iproute2
          - name: fedora
            image: fedora:41
            preinstall: dnf -y install bash ca-certificates curl git python3 procps-ng awk iproute
          - name: opensuse
            image: opensuse/tumbleweed
            preinstall: zypper --non-interactive refresh && zypper --non-interactive install -y bash ca-certificates curl git python3 procps iproute2
          - name: arch
            image: archlinux:latest
            preinstall: pacman -Sy --disable-sandbox --noconfirm --needed bash ca-certificates curl git python procps-ng iproute2 && printf '\nDisableSandbox\n' >> /etc/pacman.conf
          - name: alpine
            image: alpine:3.20
            preinstall: apk add --no-cache bash ca-certificates curl git python3 procps gawk grep sed coreutils iproute2
          - name: almalinux
            image: almalinux:10
            preinstall: dnf -y --allowerasing install bash ca-certificates curl git python3 procps-ng iproute
          - name: rockylinux
            image: rockylinux/rockylinux:10
            preinstall: dnf -y --allowerasing install bash ca-certificates curl git python3 procps-ng iproute
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Install bootstrap dependencies
        shell: sh
        run: ${{ matrix.preinstall }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run installer end to end
        shell: bash
        run: |
          set -Eeuo pipefail
          for command_name in clang bpftool llvm-strip; do
            if command -v "$command_name" >/dev/null 2>&1; then
              echo "bootstrap must not preinstall $command_name" >&2
              exit 1
            fi
          done
          cd /tmp
          bash "$GITHUB_WORKSPACE/setup_xdp.sh" 2>&1 | tee "$GITHUB_WORKSPACE/install.log"

      - name: Verify installed artifacts and compiled objects
        shell: bash
        run: bash tests/bash/assert_install_artifacts.sh install.log

      - name: Rerun installer over the existing install
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp
          bash "$GITHUB_WORKSPACE/setup_xdp.sh" 2>&1 | tee "$GITHUB_WORKSPACE/reinstall.log"

      - name: Verify overwrite reinstall
        shell: bash
        run: bash tests/bash/assert_install_artifacts.sh install.log reinstall.log

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distro-install-${{ matrix.name }}-${{ github.run_id }}
          path: |
            install.log
            reinstall.log
          if-no-files-found: warn
          retention-days: 7

  ubuntu-xdp-e2e:
    name: Full XDP E2E + Kernel (Ubuntu own kernel)
    needs: quality
    # GitHub's Ubuntu 24.04 Azure 6.17 runner has a broken kernel-tools
    # layout that leaves bpftool unusable; 26.04 ships a working bpftool.
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Ubuntu VM runner
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          test "${ID:-}" = ubuntu
          if systemd-detect-virt --container --quiet; then
            echo "runner must be a VM or bare-metal Ubuntu host, not a container" >&2
            exit 1
          fi
          test -r /sys/kernel/btf/vmlinux
          sudo -n true
          uname -a

      - name: Reset previous interrupted CI installation
        run: |
          if sudo test -x /usr/local/bin/axdp; then
            sudo /usr/local/bin/axdp uninstall
          fi
          sudo ip link del axdpci0 2>/dev/null || true
          sudo ip link add axdpci0 type veth peer name axdpci1
          sudo ip link set axdpci0 up
          sudo ip link set axdpci1 up

      - name: Require XDP backend
        run: |
          set -Eeuo pipefail
          sed -i 's/^preferred_backend = "auto"$/preferred_backend = "xdp"/' config.toml
          grep -qx 'preferred_backend = "xdp"' <(sed -n '/^preferred_backend =/p' config.toml)

      - name: Install without teardown
        run: |
          cd /tmp
          sudo bash "$GITHUB_WORKSPACE/setup_xdp.sh" \
            --allow-container-interfaces axdpci0 \
            2>&1 | tee "$GITHUB_WORKSPACE/install.log"

      - name: Verify forced XDP backend
        run: |
          set -Eeuo pipefail
          sudo grep -qx 'PREFERRED_BACKEND="xdp"' /etc/auto_xdp/auto_xdp.env
          ! sudo test -e /sys/fs/bpf/xdp_fw/prog
          sudo /usr/local/bin/axdp enable --force
          deadline=$((SECONDS + 40))
          while ! sudo test -f /run/auto_xdp/backend && (( SECONDS < deadline )); do sleep 0.2; done
          sudo test -f /run/auto_xdp/backend
          sudo grep -qx xdp /run/auto_xdp/backend
          link_details=$(sudo ip -d link show dev axdpci0)
          grep -Eq '(^|[[:space:]])prog/xdp([[:space:]]|$)|(^|[[:space:]])xdpgeneric([[:space:]]|$)|(^|[[:space:]])xdpoffload([[:space:]]|$)' \
            <<<"$link_details"

      - name: Verify installed artifacts and runtime
        run: |
          bash tests/bash/assert_install_artifacts.sh install.log
          sudo env \
            REQUIRE_SOCK_STATE_EVENT=1 \
            RUNTIME_E2E_PEER_IFACE=axdpci1 \
            bash tests/run.sh installed

      - name: Run real kernel and packet-policy integration
        run: |
          set -Eeuo pipefail
          sudo mkdir -p /sys/fs/bpf
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          sudo env \
            REQUIRE_KERNEL_TESTS=1 \
            VERIFIER_METRICS_FILE="$GITHUB_WORKSPACE/verifier-metrics.tsv" \
            bash tests/run.sh kernel 2>&1 | tee kernel-integration.log

      - name: Upload verifier metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-metrics-${{ github.run_id }}
          path: verifier-metrics.tsv
          if-no-files-found: warn
          retention-days: 30

      - name: Verify in-place upgrade and failed-candidate rollback
        run: sudo bash tests/bash/e2e_upgrade_rollback.sh 2>&1 | tee upgrade-rollback.log

      - name: Uninstall and verify no residue
        run: sudo bash tests/run.sh uninstall 2>&1 | tee uninstall.log

      - name: Reinstall from a clean host
        run: |
          cd /tmp
          sudo bash "$GITHUB_WORKSPACE/setup_xdp.sh" \
            --allow-container-interfaces axdpci0 \
            2>&1 | tee "$GITHUB_WORKSPACE/reinstall.log"

      - name: Verify reinstall, uninstall again, and check final residue
        run: |
          bash tests/bash/assert_install_artifacts.sh reinstall.log
          sudo bash tests/run.sh uninstall 2>&1 | tee final-uninstall.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-xdp-e2e-${{ github.run_id }}
          path: |
            install.log
            kernel-integration.log
            verifier-metrics.tsv
            uninstall.log
            reinstall.log
            final-uninstall.log
            upgrade-rollback.log
          if-no-files-found: warn
          retention-days: 7

      - name: Teardown
        if: always()
        run: |
          if sudo test -x /usr/local/bin/axdp; then
            sudo /usr/local/bin/axdp uninstall 2>/dev/null || true
          fi
          sudo systemctl stop xdp-port-sync auto-xdp-relay 2>/dev/null || true
          sudo ip link set dev axdpci0 xdp off 2>/dev/null || true
          sudo nft delete table inet auto_xdp 2>/dev/null || true
          sudo ip link del axdpci0 2>/dev/null || true

  ubuntu-fallback-e2e:
    name: nftables Fallback E2E (Ubuntu own kernel)
    needs: quality
    # GitHub's Ubuntu 24.04 Azure 6.17 runner has a broken kernel-tools
    # layout that leaves bpftool unusable; 26.04 ships a working bpftool.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Ubuntu VM runner
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          test "${ID:-}" = ubuntu
          if systemd-detect-virt --container --quiet; then
            echo "runner must be a VM or bare-metal Ubuntu host, not a container" >&2
            exit 1
          fi
          test -r /sys/kernel/btf/vmlinux
          sudo -n true
          uname -a

      - name: Run nftables fallback detection flow
        run: |
          set -Eeuo pipefail
          sudo bash tests/bash/e2e_nftables_fallback.sh 2>&1 | tee nftables-fallback.log

      - name: Upload fallback diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-fallback-e2e-${{ github.run_id }}
          path: nftables-fallback.log
          if-no-files-found: warn
          retention-days: 7
